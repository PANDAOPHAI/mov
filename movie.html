    /* Background video styling (PC / tablet) */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2));
      z-index: -1;
    }

    /* Mobile: video hidden (and JS se src bhi hat jayega) */
    @media (max-width: 768px) {
      #bg-video {

    }
  </style>

  <!-- JS: mobile pe video ka src hata de, desktop pe set kare -->
  <script>
    (function () {
      const video = document.getElementById('bg-video');
      if (!video) return;

      const source = video.querySelector('source');
      if (!source) return;

      const realSrc = source.getAttribute('data-src');

      function updateBgVideo() {
        const isMobile = window.matchMedia('(max-width: 768px)').matches;

        if (isMobile) {
          // Mobile: src hatao, video stop karo, bg color rakho
          try { video.pause(); } catch (e) {}
          source.removeAttribute('src');
          video.removeAttribute('src');
          video.load();
          document.body.style.backgroundColor = '#141313';
        } else {
          // Desktop / Tablet: src wapas lagao agar nahi hai
          if (!source.src && realSrc) {
            source.src = realSrc;
            video.load();
            // autoplay already true hai
          }
        }
      }

      updateBgVideo();
      window.addEventListener('resize', updateBgVideo);
    })();
  </script>
