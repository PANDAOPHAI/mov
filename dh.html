<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>M3U8 Player - Start from 5 Minutes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050816;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
      padding: 16px;
    }

    .player-card {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 8px;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    .info {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="player-card">
      <h1>M3U8 Player (Starts from 5:00)</h1>

      <div class="video-container">
        <!-- Poster change kar sakte ho (optional) -->
        <video
          id="video"
          controls
          preload="metadata"
          poster="poster.jpg"
        ></video>
      </div>

      <p class="info" id="status">
        Video 5 minute (300 seconds) se start hoga. Just Play button dabao.
      </p>
    </div>
  </div>

  <!-- HLS.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");

    // Tumhara m3u8 link
    const streamUrl =
      "https://radeon.tvlogy.to/HjgEInZEMm_5WeBmW3NicQpiWP9eayvqTrW1Ob00QLu4hsVocKMipoEk6RBxJg7NuutK9cZiqE69nAlN07I-TYyncyR3nX15VnSN4Y0Hehx3pt2d-N4Zk8quHqnd6Hlj88DCB4luj693Wuaok7Hzz__sWx775AUQ-ypvv9K8ozjQU7tBVLKOv9Fws5jmqVQy1YpQSbQPTwwJ9Ij06S0GLS69DnInN-3PUHzzoytEC48/tgy6gEsmODR1ZLPaXwmpDXJmxIqrjLm0q4zxmPBehCU/480.m3u8";

    // 5 minute = 300 seconds
    const START_TIME = 100;

    function logStatus(msg) {
      if (statusEl) statusEl.textContent = msg;
    }

    if (Hls.isSupported()) {
      // Desktop Chrome/Firefox/Edge, etc.
      const hls = new Hls({
        startPosition: START_TIME, // yahi se start karega
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        logStatus("Loaded! Click Play — video 5:00 se start hoga.");
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        console.error("HLS error:", data);
        logStatus("Kuch error aa gaya. Maybe link blocked / expired.");
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      // iPhone / Safari native HLS support
      video.src = streamUrl;

      video.addEventListener("loadedmetadata", function () {
        try {
          video.currentTime = START_TIME;
          logStatus("Safari: Click Play — video 5:00 se start hoga.");
        } catch (e) {
          console.error(e);
          logStatus("Seek error on Safari.");
        }
      });
    } else {
      logStatus(
        "Yeh browser direct HLS support nahi karta. Chrome/Edge/Firefox use karo."
      );
    }
  </script>
</body>
</html>
